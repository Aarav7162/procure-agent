<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ProcureAgent Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .window-header {
      background: #121214;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #eab308; }
    .dot-green { background: #22c55e; }
    .window-title {
      margin-left: 12px;
      font-size: 12px;
      color: #71717a;
      letter-spacing: 0.05em;
    }
    .terminal-body {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .c-cyan { color: #06b6d4; }
    .c-green { color: #22c55e; }
    .c-red { color: #ef4444; }
    .c-yellow { color: #eab308; }
    .c-dim { color: #71717a; }
    .c-bold { font-weight: bold; color: #ffffff; }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: #22c55e;
      vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="window-header">
    <span class="dot dot-red"></span>
    <span class="dot dot-yellow"></span>
    <span class="dot dot-green"></span>
    <span class="window-title">procure-agent // interactive capability procurement terminal</span>
  </div>
  <div class="terminal-body" id="term"></div>

  <script>
    const term = document.getElementById("term");

    function appendHtml(html) {
      term.innerHTML += html;
      term.scrollTop = term.scrollHeight;
    }

    async function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function typeCommand(cmd, prompt = "  › ") {
      appendHtml(prompt);
      for (let i = 0; i < cmd.length; i++) {
        appendHtml(cmd[i]);
        await sleep(40);
      }
      appendHtml("\n");
      await sleep(200);
    }
  </script>
</body>
</html>
