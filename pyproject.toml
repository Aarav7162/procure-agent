[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procure-agent"
version = "1.0.0"
description = "Autonomous AI capability procurement and settlement network."
authors = [{ name = "Aarav Sharma", email = "70362472+Aarav7162@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "websockets>=12.0",
    "pyyaml>=6.0.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "colorama>=0.4.6",
]

[project.scripts]
procure-agent = "procure.cli:main"
worker-agent = "procure.worker_cli:main"

